[project]
name = "roux-engine"
version = "0.1.0"
description = "Roux AI Speedcube Coach & Critique Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

[project.scripts]
roux = "roux_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roux_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
